<div *ngIf="isLoading">
  <p>Loading...</p>
</div>

<div *ngIf="!isLoading && album">

  <h2>Album Detail</h2>

  <p><b>ID:</b> {{ album.id }}</p>
  <p><b>User:</b> {{ album.userId }}</p>
  <p><b>Title:</b> {{ album.title }}</p>

  <h3>Edit title</h3>

  <input type="text" [(ngModel)]="updatedTitle">

  <button (click)="onSave()">Save</button>

  <br><br>

  <a [routerLink]="['/albums', album.id, 'photos']">
    View Photos
  </a>

  <br>

  <a routerLink="/albums">
    Back
  </a>

</div>
